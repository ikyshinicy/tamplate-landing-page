<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asyilla Homemade</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/tema.css" />
</head>
<body>

  <!-- NAVIGASI -->
  <nav id="navbar">
    <div class="container nav-inner">
      <a href="#" class="logo" id="brand-name"></a>
      <ul class="nav-links">
        <li><a href="#tentang">Tentang</a></li>
        <li><a href="#produk">Produk</a></li>
        <li><a href="#harga">Harga</a></li>
        <li><a href="#testimoni">Testimoni</a></li>
        <li><a href="#kontak" class="btn-nav">Pesan</a></li>
      </ul>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero">
    <div class="container hero-inner">
      <div class="hero-text">
        <p class="hero-label" id="hero-label"></p>
        <h1 id="hero-judul"></h1>
        <p class="hero-sub" id="hero-tagline"></p>
        <a href="#kontak" class="btn-primary" id="hero-cta"></a>
      </div>
      <div class="hero-img">
        <img id="foto-hero" src="" alt="Produk Unggulan" />
      </div>
    </div>
  </section>

  <!-- TENTANG -->
  <section id="tentang">
    <div class="container tentang-inner">
      <div class="tentang-text">
        <p class="section-label">Tentang Kami</p>
        <h2 id="tentang-judul"></h2>
        <p id="tentang-deskripsi"></p>
      </div>
      <div class="tentang-stats">
        <div class="stat-item">
          <span class="stat-angka" id="stat-1-angka"></span>
          <span class="stat-label" id="stat-1-label"></span>
        </div>
        <div class="stat-item">
          <span class="stat-angka" id="stat-2-angka"></span>
          <span class="stat-label" id="stat-2-label"></span>
        </div>
        <div class="stat-item">
          <span class="stat-angka" id="stat-3-angka"></span>
          <span class="stat-label" id="stat-3-label"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- PRODUK -->
  <section id="produk">
    <div class="container">
      <p class="section-label text-center">Menu Kami</p>
      <h2 class="section-judul text-center" id="produk-judul"></h2>
      <div class="produk-grid" id="produk-grid"></div>
    </div>
  </section>

  <!-- HARGA -->
  <section id="harga">
    <div class="container">
      <p class="section-label text-center">Harga</p>
      <h2 class="section-judul text-center" id="harga-judul"></h2>
      <div class="harga-grid" id="harga-grid"></div>
    </div>
  </section>

  <!-- TESTIMONI -->
  <section id="testimoni">
    <div class="container">
      <p class="section-label text-center">Testimoni</p>
      <h2 class="section-judul text-center" id="testimoni-judul"></h2>
      <div class="testimoni-grid" id="testimoni-grid"></div>
    </div>
  </section>

  <!-- KONTAK / CTA -->
  <section id="kontak">
    <div class="container kontak-inner">
      <p class="section-label">Hubungi Kami</p>
      <h2 id="kontak-judul"></h2>
      <p id="kontak-sub"></p>
      <div class="kontak-info">
        <a id="kontak-wa" href="#" class="btn-primary" target="_blank">WhatsApp</a>
        <p id="kontak-alamat"></p>
        <p id="kontak-jam"></p>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer id="footer">
    <div class="container footer-inner">
      <p id="footer-text"></p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="assets/js/main.js"></script>

</body>
</html>
